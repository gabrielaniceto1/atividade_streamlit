# [IA] ChatGPT Codex - apoio na identidade visual e na sintaxe do tema Streamlit.

[theme]
font = "sans-serif"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1rem"
paddingBottom = "2rem"
chartCategoricalColors = ["#B45309", "#1D4ED8", "#047857", "#7C3AED", "#BE123C", "#0E7490", "#4B5563"]

[theme.light]
primaryColor = "#A44F05"
backgroundColor = "#FCFAF5"
secondaryBackgroundColor = "#F1EADD"
textColor = "#1D2939"
borderColor = "#D8CDBB"
codeBackgroundColor = "#F4EFE6"
linkColor = "#8A3F03"

[theme.dark]
primaryColor = "#B45309"
backgroundColor = "#111827"
secondaryBackgroundColor = "#1F2937"
textColor = "#F9FAFB"
borderColor = "#374151"
codeBackgroundColor = "#1F2937"
linkColor = "#FBBF24"

[theme.light.sidebar]
backgroundColor = "#172033"
secondaryBackgroundColor = "#243047"
textColor = "#F9FAFB"
borderColor = "#334155"
primaryColor = "#B45309"
linkColor = "#FBBF24"
paddingTop = "1rem"

[theme.dark.sidebar]
backgroundColor = "#080D18"
secondaryBackgroundColor = "#172033"
textColor = "#F9FAFB"
borderColor = "#293548"
primaryColor = "#B45309"
linkColor = "#FBBF24"
paddingTop = "1rem"
